<ion-tabs>
  <ion-tab-bar slot="bottom">
    <ion-tab-button tab="classes" href="/tabs/classes">
      <span class="tab-tile t-library"><ion-icon aria-hidden="true" name="people"></ion-icon></span>
      <ion-icon class="tab-plain" aria-hidden="true" name="people-outline"></ion-icon>
      <ion-label>Classes</ion-label>
    </ion-tab-button>
    <ion-tab-button tab="keys" href="/tabs/keys">
      <span class="tab-tile t-exams"><ion-icon aria-hidden="true" name="key"></ion-icon></span>
      <ion-icon class="tab-plain" aria-hidden="true" name="key-outline"></ion-icon>
      <ion-label>Keys</ion-label>
    </ion-tab-button>
    <ion-tab-button tab="checking" href="/tabs/checking">
      <span class="tab-tile t-add"><ion-icon aria-hidden="true" name="scan"></ion-icon></span>
      <ion-icon class="tab-plain" aria-hidden="true" name="scan-outline"></ion-icon>
      <ion-label>Scan</ion-label>
    </ion-tab-button>
    <ion-tab-button tab="create" href="/tabs/create">
      <span class="tab-tile t-progress"><ion-icon aria-hidden="true" name="sparkles"></ion-icon></span>
      <ion-icon class="tab-plain" aria-hidden="true" name="sparkles-outline"></ion-icon>
      <ion-label>Create</ion-label>
    </ion-tab-button>
    <ion-tab-button tab="reports" href="/tabs/reports">
      <span class="tab-tile t-settings"><ion-icon aria-hidden="true" name="stats-chart"></ion-icon></span>
      <ion-icon class="tab-plain" aria-hidden="true" name="stats-chart-outline"></ion-icon>
      <ion-label>Results</ion-label>
    </ion-tab-button>
  </ion-tab-bar>
</ion-tabs>
