<ion-tabs>
  <ion-tab-bar slot="bottom">
    <ion-tab-button tab="library" href="/tabs/library">
      <span class="tab-tile t-library"><ion-icon aria-hidden="true" name="book"></ion-icon></span>
      <ion-icon class="tab-plain" aria-hidden="true" name="book-outline"></ion-icon>
      <ion-label>Library</ion-label>
    </ion-tab-button>
    <ion-tab-button tab="exams" href="/tabs/exams">
      <span class="tab-tile t-exams"><ion-icon aria-hidden="true" name="document-text"></ion-icon></span>
      <ion-icon class="tab-plain" aria-hidden="true" name="document-text-outline"></ion-icon>
      <ion-label>Exams</ion-label>
    </ion-tab-button>
    <ion-tab-button tab="import" href="/tabs/import">
      <span class="tab-tile t-add"><ion-icon aria-hidden="true" name="add"></ion-icon></span>
      <ion-icon class="tab-plain" aria-hidden="true" name="add-outline"></ion-icon>
      <ion-label>Add</ion-label>
    </ion-tab-button>
    <ion-tab-button tab="history" href="/tabs/history">
      <span class="tab-tile t-progress"><ion-icon aria-hidden="true" name="stats-chart"></ion-icon></span>
      <ion-icon class="tab-plain" aria-hidden="true" name="stats-chart-outline"></ion-icon>
      <ion-label>Progress</ion-label>
    </ion-tab-button>
    <ion-tab-button tab="settings" href="/tabs/settings">
      <span class="tab-tile t-settings"><ion-icon aria-hidden="true" name="settings"></ion-icon></span>
      <ion-icon class="tab-plain" aria-hidden="true" name="settings-outline"></ion-icon>
      <ion-label>Settings</ion-label>
    </ion-tab-button>
  </ion-tab-bar>
</ion-tabs>
