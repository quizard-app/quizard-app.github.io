<div class="tut-wrap intro-motion">
  <div class="onb-top">
    <button class="onb-skip" type="button" (click)="finish()" data-tooltip="Skip the tutorial">Skip</button>
    <div class="onb-progress" role="progressbar" aria-label="Tutorial progress" aria-valuemin="1" [attr.aria-valuemax]="slides.length" [attr.aria-valuenow]="idx + 1">
      <div class="onb-progress-fill" [style.width.%]="((idx + 1) / slides.length) * 100"></div>
    </div>
  </div>
  <div class="onb-viewport" #viewport (touchstart)="onTouchStart($event)" (touchend)="onTouchEnd($event)">
    <div class="tut-slides" #slidesEl [style.transform]="'translateX(-' + idx * 100 + '%)'">
      @for (s of slides; track $index) {
        <div class="tut-slide" [attr.data-accent]="s.accent" [class.active]="$index === idx">
          <div class="tut-stage">
            <div class="tut-phone">
              @if ($index < 2) {
                <img class="tut-screenshot" [src]="s.img" [alt]="s.title" decoding="async" fetchpriority="high" />
              } @else {
                <img class="tut-screenshot" [attr.data-src]="s.img" [alt]="s.title" decoding="async" loading="lazy" />
              }
              @if (s.highlight) {
                <div class="tut-highlight-ring" [style.left.%]="s.highlight.x" [style.top.%]="s.highlight.y" [style.width.%]="s.highlight.w" [style.height.%]="s.highlight.h">
                  <div class="tut-highlight-glow"></div>
                  <div class="tut-highlight-label">{{ s.highlight.label }}</div>
                </div>
              }
            </div>
          </div>
          <div class="tut-copy">
            <div class="tut-portrait">
              <img class="tut-wiz" [src]="portraitUrl(s)" alt="" decoding="async" />
              <div class="tut-portrait-glow"></div>
            </div>
            <div class="tut-text">
              <h2>{{ s.title }}</h2>
              <p>{{ s.text }}</p>
            </div>
          </div>
        </div>
      }
    </div>
  </div>
  <div class="onb-bottom">
    <div class="onb-dots" aria-hidden="true">
      @for (s of slides; track $index) {
        <span class="onb-dot" [class.on]="$index === idx"></span>
      }
    </div>
    <div class="onb-cta-row">
      <button class="onb-back" type="button" aria-label="Previous slide" [hidden]="idx === 0" (click)="back($event)">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <button class="btn btn-primary onb-next" type="button" (click)="next($event)">
        <span class="onb-next-label">{{ isLast ? 'Get Started' : 'Continue' }}</span>
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 5l7 7-7 7"/></svg>
      </button>
    </div>
  </div>
</div>
