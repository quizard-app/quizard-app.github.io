<!doctype html><meta charset="utf-8"><script type="module">
import * as pdfjs from './pdf.min.mjs?v=11';
pdfjs.GlobalWorkerOptions.workerSrc = './pdf.worker.min.mjs?v=11';
import { bubbleCenter, SHEET } from './sheet-spec.js?v=11';
window.rasterize = async (b64, answers) => {
  const pdf = await pdfjs.getDocument({ data: Uint8Array.from(atob(b64), c => c.charCodeAt(0)) }).promise;
  const page = await pdf.getPage(1);
  const SCALE = 2.0;
  const vp = page.getViewport({ scale: SCALE });
  const canvas = document.createElement('canvas');
  canvas.width = Math.round(vp.width); canvas.height = Math.round(vp.height);
  const ctx = canvas.getContext('2d');
  await page.render({ canvas, canvasContext: ctx, viewport: vp }).promise;
  const count = answers.length;
  ctx.fillStyle = '#000';
  answers.forEach((letter, i) => {
    const b = 'ABCD'.indexOf(letter);
    const c = bubbleCenter(count, i, b);
    ctx.beginPath(); ctx.arc(c.x * SCALE, c.y * SCALE, SHEET.circleR * 0.8 * SCALE, 0, Math.PI * 2); ctx.fill();
  });
  return canvas.toDataURL('image/png');
};
</script>
