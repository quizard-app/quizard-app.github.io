[build]
  command = "vite build"
  publish = "dist"

[functions]
  directory = "netlify/functions"

# ── Security headers ──────────────────────────────────────────────────────
# CSP mirrors the meta tag injected at build time (vite.config.js cspMeta).
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), payment=(), usb=(), interest-cohort=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Cross-Origin-Opener-Policy = "same-origin"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self' https://live--quizard-67e6a203.netlify.app https://quizard-67e6a203.netlify.app; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'"

# The service worker and workbox runtime must never be cached by the browser's
# HTTP cache (the SW handles its own versioning).
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/workbox-*"
  [headers.values]
    Cache-Control = "no-cache"
